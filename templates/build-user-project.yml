name: APK Studio - Build User Project
run-name: APK Studio ${{ inputs.build_variant }} project build

on:
  workflow_dispatch:
    inputs:
      archive_path:
        description: "Temporary ZIP path uploaded by APK Studio"
        required: true
        type: string
      build_variant:
        description: "Android APK variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build uploaded Android project
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2.1"

      - name: Validate and safely extract project ZIP
        id: project
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        run: |
          set -euo pipefail
          if [[ ! "$ARCHIVE_PATH" =~ ^cloud-builds/apk-studio-[a-f0-9-]+\.zip$ ]]; then
            echo "Unexpected archive path."
            exit 1
          fi
          test -f "$ARCHIVE_PATH"
          mkdir -p "$RUNNER_TEMP/apk-studio-project"
          python3 - "$ARCHIVE_PATH" "$RUNNER_TEMP/apk-studio-project" <<'PY'
          import pathlib
          import shutil
          import stat
          import sys
          import zipfile

          archive_path = pathlib.Path(sys.argv[1])
          destination_root = pathlib.Path(sys.argv[2]).resolve()
          maximum_files = 25000
          maximum_unpacked = 400 * 1024 * 1024
          total_unpacked = 0

          with zipfile.ZipFile(archive_path) as archive:
              entries = archive.infolist()
              if len(entries) > maximum_files:
                  raise SystemExit("Project archive contains too many files.")
              for entry in entries:
                  name = entry.filename.replace("\\", "/")
                  relative = pathlib.PurePosixPath(name)
                  if relative.is_absolute() or not relative.parts or any(part in ("", ".", "..") for part in relative.parts):
                      raise SystemExit(f"Unsafe ZIP path: {entry.filename}")
                  unix_mode = (entry.external_attr >> 16) & 0o170000
                  if unix_mode == stat.S_IFLNK:
                      raise SystemExit(f"Symbolic links are not allowed: {entry.filename}")
                  total_unpacked += entry.file_size
                  if total_unpacked > maximum_unpacked:
                      raise SystemExit("Unpacked project exceeds the 400 MB safety limit.")
                  target = (destination_root / pathlib.Path(*relative.parts)).resolve()
                  try:
                      target.relative_to(destination_root)
                  except ValueError:
                      raise SystemExit(f"ZIP path escapes project directory: {entry.filename}")
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(entry) as source, target.open("wb") as output:
                          shutil.copyfileobj(source, output)
          PY

          SETTINGS_FILE="$(find "$RUNNER_TEMP/apk-studio-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "No settings.gradle or settings.gradle.kts found. Import a native Android Gradle project or a supported HTML project."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project root: $PROJECT_DIR"

      - name: Prepare Gradle wrapper
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [ ! -f "$PROJECT_DIR/gradlew" ] || [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            (cd "$PROJECT_DIR" && gradle wrapper --gradle-version 8.2.1 --distribution-type bin)
          fi
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          if [ "$BUILD_VARIANT" = "release" ]; then
            TASK="assembleRelease"
          else
            TASK="assembleDebug"
          fi
          cd "$PROJECT_DIR"
          ./gradlew "$TASK" --stacktrace --no-daemon --console=plain

      - name: Locate APK output
        id: apk
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/$BUILD_VARIANT/*.apk" -print | sort)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "Gradle completed but no $BUILD_VARIANT APK was found."
            exit 1
          fi
          {
            echo "path<<APK_PATHS"
            printf '%s\n' "${APK_FILES[@]}"
            echo "APK_PATHS"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-studio-user-${{ inputs.build_variant }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  cleanup:
    name: Remove temporary upload branch
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$BUILD_BRANCH" == apk-studio-build-* ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BUILD_BRANCH}" || true
          fi
