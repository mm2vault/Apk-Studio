name: APK Studio - Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "APK build variant"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: apk-studio-android-build-${{ github.ref }}-${{ inputs.build_variant || 'debug' }}
  cancel-in-progress: false

jobs:
  web-wrapper-smoke:
    name: Verify HTML/CSS/JS to Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2.1"
      - name: Generate and build a temporary WebView APK
        run: npm run test:web-apk

  build:
    needs: web-wrapper-smoke
    name: Build ${{ inputs.build_variant || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_APP_VERSION: 0.1.${{ github.run_number }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android version
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("app/build.gradle")
          if not path.exists():
              raise SystemExit("Expected app/build.gradle was not generated.")
          source = path.read_text()
          source, code_count = re.subn(r'versionCode\s+\d+', f'versionCode {os.environ["BUILD_NUMBER"]}', source, count=1)
          source, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "0.1.{os.environ["BUILD_NUMBER"]}"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely update Android versionCode/versionName.")
          path.write_text(source)
          PY

      - name: Prepare Release signing key
        if: ${{ inputs.build_variant == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apk-studio-release.jks"
          test -s "$RUNNER_TEMP/apk-studio-release.jks"
          chmod 600 "$RUNNER_TEMP/apk-studio-release.jks"

      - name: Build APK
        working-directory: android
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
          KEYSTORE_FILE: ${{ runner.temp }}/apk-studio-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "$BUILD_VARIANT" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate APK
        id: apk
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
        run: |
          APK_PATH="$(find "android/app/build/outputs/apk/${BUILD_VARIANT}" -maxdepth 1 -type f -name "*.apk" | sort | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "APK file was not produced."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Store Debug APK as test artifact
        if: ${{ (inputs.build_variant || 'debug') == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-studio-debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed Release APK
        if: ${{ inputs.build_variant == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          RELEASE_APK_PATH: ${{ runner.temp }}/apk-studio-release.apk
        run: |
          cp "$APK_PATH" "$RELEASE_APK_PATH"
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" "$RELEASE_APK_PATH" \
            --title "APK Studio v0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Signed APK Studio release. Android versionCode: ${GITHUB_RUN_NUMBER}. Install over an existing copy only when signed with the same release keystore."

      - name: Update public update manifest
        if: ${{ inputs.build_variant == 'release' }}
        env:
          RELEASE_TAG: v0.1.${{ github.run_number }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v0.1.${{ github.run_number }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/v0.1.${{ github.run_number }}/apk-studio-release.apk
          APK_PATH: ${{ runner.temp }}/apk-studio-release.apk
        run: |
          mkdir -p public
          python3 - <<'PY'
          import json, os
          tag = os.environ['RELEASE_TAG']
          data = {
              'tag_name': tag,
              'name': f'APK Studio {tag}',
              'body': 'Signed Release APK. Android versionCode: ' + os.environ['GITHUB_RUN_NUMBER'] + '.',
              'html_url': os.environ['RELEASE_URL'],
              'published_at': os.environ['GITHUB_RUN_ID'],
              'assets': [{'name': 'apk-studio-release.apk', 'label': 'apk-studio-release.apk', 'browser_download_url': os.environ['APK_URL'], 'size': os.path.getsize(os.environ['APK_PATH'])}],
              'prerelease': False,
              'draft': False
          }
          # Use a valid ISO timestamp; the manifest is only a fallback source.
          from datetime import datetime, timezone
          data['published_at'] = datetime.now(timezone.utc).isoformat()
          with open('public/update-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/update-manifest.json
          git commit -m "chore: update release manifest [skip ci]" || exit 0
          git push
