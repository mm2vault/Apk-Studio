name: APK Studio - Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "APK build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: apk-studio-android-build-${{ github.ref }}-${{ inputs.build_variant }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_variant }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: android
        env:
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          chmod +x ./gradlew
          ./gradlew "assemble${BUILD_VARIANT^}" --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-studio-${{ inputs.build_variant }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
