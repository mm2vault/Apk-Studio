name: APK Studio - Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "APK build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: apk-studio-android-build-${{ github.ref }}-${{ inputs.build_variant || 'debug' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_variant || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_APP_VERSION: 0.1.${{ github.run_number }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        working-directory: android
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
        run: |
          chmod +x ./gradlew
          ./gradlew "assemble${BUILD_VARIANT^}" --stacktrace --no-daemon

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
        run: |
          APK_PATH="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "APK file was not produced."
            exit 1
          fi
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" "$APK_PATH" \
            --title "APK Studio ${BUILD_VARIANT} build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatically generated APK Studio Android build." \
            
